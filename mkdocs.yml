site_name: Android & Kotlin Notes
site_description: Personal documentation on Kotlin, Android, Jetpack Compose, Gradle, DI and more.
site_author: Sonay

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/android
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Readings:
      - Overview: readings/index.md
      - Do This: readings/do-this/index.md
      - Don't Do This: readings/dont-do-this/index.md
      - Investigate: readings/investigate/index.md
      - Tasks For Me: readings/tasks-for-me/index.md
      - Why Don't We Do This: readings/why-dont-we-do-this/index.md
      - Keep This Note: readings/keep-this-note/index.md
      - I Don't Get It: readings/needs-more-attention/index.md
  - Ideas: ideas/index.md
  - Reference:
      - Overview: reference/index.md
      - Glossary: reference/glossary.md
      - Phrasebook: reference/phrasebook.md
  - Q&A:
      - Overview: qa/index.md
      - Kotlin: qa/kotlin.md
      - Coroutines & Concurrency: qa/coroutines-concurrency.md
      - Android Core & Internals: qa/android-core.md
      - Jetpack Compose: qa/compose.md
      - Views & RecyclerView: qa/views-recyclerview.md
      - Architecture & Design Patterns: qa/architecture-patterns.md
      - Dependency Injection: qa/dependency-injection.md
      - Testing: qa/testing.md
      - Networking: qa/networking.md
      - Persistence: qa/persistence.md
      - Performance & Rendering: qa/performance.md
      - Security & Privacy: qa/security-privacy.md
      - Build & CI/CD: qa/build-ci.md
      - System APIs & Hardware: qa/system-apis.md
      - System Design: qa/system-design.md
      - Release & Ops Practices: qa/release-practices.md
      - Kotlin Multiplatform & Misc: qa/kmp-misc.md
  - Documentation: documentation/index.md
