site_name: Android & Kotlin Notes
site_description: Personal documentation on Kotlin, Android, Jetpack Compose, Gradle, DI and more.
site_author: Sonay

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/android
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Docs:
      - Architecture:
          - Android: android/index.md
          - Dependency Injection: dependency-injection/index.md
      - UI:
          - Jetpack Compose: jetpack-compose/index.md
          - Material Design: material/index.md
      - Build & Publish:
          - Gradle: gradle/index.md
          - JitPack: jitpack/index.md
      - Networking:
          - Retrofit: retrofit/index.md
  - Readings:
      - Overview: readings/index.md
      - Do This: readings/do-this/index.md
      - Don't Do This: readings/dont-do-this/index.md
      - Investigate: readings/investigate/index.md
      - Tasks For Me: readings/tasks-for-me/index.md
      - Why Don't We Do This: readings/why-dont-we-do-this/index.md
      - Keep This Note: readings/keep-this-note/index.md
      - I Don't Get It: readings/needs-more-attention/index.md
  - Ideas: ideas/index.md
  - Learnings:
      - Overview: learnings/index.md
      - Glossary: learnings/glossary.md
      - By Level: learnings/by-level.md
      - General:
          - Overview: learnings/general/index.md
          - Compiler: learnings/general/compiler.md
          - Generics: learnings/general/generics.md
          - Type Erasure: learnings/general/type-erasure.md
          - Inline (Inlining): learnings/general/inline.md
          - Higher-Order Functions: learnings/general/higher-order-functions.md
      - Patterns:
          - Overview: learnings/patterns/index.md
          - Builder: learnings/patterns/builder.md
          - Singleton: learnings/patterns/singleton.md
          - Factory: learnings/patterns/factory.md
          - Observer: learnings/patterns/observer.md
          - Strategy: learnings/patterns/strategy.md
          - Decorator: learnings/patterns/decorator.md
          - Adapter: learnings/patterns/adapter.md
          - Repository: learnings/patterns/repository.md
      - Kotlin:
          - Overview: learnings/kotlin/index.md
          - Scope Functions: learnings/kotlin/scope-functions.md
          - Inline Functions & Reified Type Parameters: learnings/kotlin/inline-reified.md
          - Inheritance: learnings/kotlin/inheritance.md
          - Interfaces: learnings/kotlin/interfaces.md
          - Data Classes: learnings/kotlin/data-classes.md
          - Sealed Classes & Interfaces: learnings/kotlin/sealed.md
          - Object Declarations: learnings/kotlin/object-declarations.md
          - Companion Objects: learnings/kotlin/companion-objects.md
          - Value Classes: learnings/kotlin/value-classes.md
          - Annotations: learnings/kotlin/annotations.md
          - Coroutines: learnings/kotlin/coroutines.md
          - Structured Concurrency: learnings/kotlin/structured-concurrency.md
          - Flow: learnings/kotlin/flow.md
          - Dispatchers: learnings/kotlin/dispatchers.md
