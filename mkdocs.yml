site_name: Android & Kotlin Notes
site_description: Personal documentation on Kotlin, Android, Jetpack Compose, Gradle, DI and more.
site_author: Sonay

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/android
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Docs:
      - Language:
          - Kotlin:
              - Overview: kotlin/index.md
              - Scope Functions: kotlin/scope-functions.md
          - Coroutines & Flow: coroutines-flow/index.md
      - Architecture:
          - Android: android/index.md
          - Dependency Injection: dependency-injection/index.md
      - UI:
          - Jetpack Compose: jetpack-compose/index.md
          - Material Design: material/index.md
      - Build & Publish:
          - Gradle: gradle/index.md
          - JitPack: jitpack/index.md
      - Networking:
          - Retrofit: retrofit/index.md
  - Readings:
      - Overview: readings/index.md
      - Do This: readings/do-this/index.md
      - Don't Do This: readings/dont-do-this/index.md
      - Investigate: readings/investigate/index.md
      - Tasks For Me: readings/tasks-for-me/index.md
      - Why Don't We Do This: readings/why-dont-we-do-this/index.md
      - Keep This Note: readings/keep-this-note/index.md
      - I Don't Get It: readings/needs-more-attention/index.md
  - Ideas: ideas/index.md
  - Learnings: learnings/index.md
